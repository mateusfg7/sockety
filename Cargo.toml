[package]
name = "sockety"
version = "0.1.0"
authors = ["Mateus Felipe Gonçalves <mateusfg7.kmclara@gmail.com>"]
edition = "2021"
description = "Test and debug Socket.IO servers"
# FIXME Set the project license
# license = "GPL-3.0-or-later"
repository = "https://github.com/mateusfg7/sockety"

[profile.release]
lto = true

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
